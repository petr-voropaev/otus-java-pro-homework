server:
  port: 8080

spring:
  datasource:
    url: ${APP_DATASOURCE_URL:jdbc:postgresql://localhost:5430/demoDB}
    username: ${APP_DATASOURCE_USERNAME:usr}
    password: ${APP_DATASOURCE_PASSWORD:pwd}
  flyway:
    locations: classpath:db/migration

logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: TRACE
